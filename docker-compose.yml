# Base stack. Prod runs this file ALONE:
#   docker compose -p rate-site -f docker-compose.yml up -d
# Dev layers docker-compose.dev.yml on top; see the comments in that file for
# why it pins its own `name:` and uses `!override`.
name: rate-site

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mensa_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${POSTGRES_DB:-mensa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    environment:
      # DML-only role -- see ops/setup-db-roles.sh
      DATABASE_URL: ${DATABASE_URL}
      # Owner role, used only by init_db() for schema changes
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      TZ: Europe/Berlin
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
