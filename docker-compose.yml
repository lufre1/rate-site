# Base stack. Prod runs this file ALONE:
#   docker compose -p rate-site -f docker-compose.yml up -d
# Dev layers docker-compose.dev.yml on top; see the comments in that file for
# why it pins its own `name:` and uses `!override`.
name: rate-site

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    # Ceilings, not reservations -- steady state is ~40 MB. The point is that no
    # container can ever be the thing that eats this 3.8 GiB host, and that one
    # which tries is killed with OOMKilled=true (a clear record) instead of
    # taking the machine down silently, as happened on 2026-08-31/09-01.
    # memswap_limit > mem_limit leaves the db a little swap: an OOM-killed
    # postgres backend forces the whole cluster into crash recovery.
    mem_limit: 768m
    memswap_limit: 1g
    oom_score_adj: -500
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mensa_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${POSTGRES_DB:-mensa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # memswap_limit == mem_limit => no swap for this container. Being restarted
    # by `restart: unless-stopped` beats dragging a swapless host into a livelock.
    mem_limit: 512m
    memswap_limit: 512m
    oom_score_adj: -300
    # Liveness only -- /api/v1/health does not touch the database on purpose, so
    # a Postgres blip cannot mark the backend unhealthy when restarting it is
    # exactly what cannot help. NOTE: Compose does NOT restart an unhealthy
    # container; this is a signal. ops/check-stack.sh is what acts on it.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 3 http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    env_file: .env
    expose:
      - "8000"
    environment:
      # DML-only role -- see ops/setup-db-roles.sh
      DATABASE_URL: ${DATABASE_URL}
      # Owner role, used only by init_db() for schema changes
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      TZ: Europe/Berlin
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    expose:
      - "80"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    ports:
      - "${PROXY_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:rw
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
