# Log the port and scheme, which the stock `main` format omits. On 2026-09-01 an
# outage came down to "did their HTTPS request actually arrive?", and the access
# log could not answer it: every line looked identical whether it came in on 80
# or 443. $server_port and $scheme make that a one-line grep.
log_format proxymain '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent :$server_port $scheme '
                     '"$http_referer" "$http_user_agent"';

# HTTP: redirect everything to HTTPS with the canonical hostname
server {
    listen 80;
    server_name 141.5.100.246 c100-246.cloud.gwdg.de;
    access_log /var/log/nginx/access.log proxymain;

    # ACME challenge for certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://c100-246.cloud.gwdg.de$request_uri;
    }
}

# HTTPS: serve the application
server {
    listen 443 ssl;
    server_name c100-246.cloud.gwdg.de;
    client_max_body_size 10M;
    access_log /var/log/nginx/access.log proxymain;

    ssl_certificate /etc/letsencrypt/live/c100-246.cloud.gwdg.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c100-246.cloud.gwdg.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=30s;

    location / {
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1 {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
