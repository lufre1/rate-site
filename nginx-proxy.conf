# Log the port and scheme, which the stock `main` format omits. On 2026-09-01 an
# outage came down to "did their HTTPS request actually arrive?", and the access
# log could not answer it: every line looked identical whether it came in on 80
# or 443. $server_port and $scheme make that a one-line grep.
log_format proxymain '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent :$server_port $scheme '
                     'rt=$request_time urt=$upstream_response_time '
                     '"$http_referer" "$http_user_agent"';
# The bundle went out uncompressed until 2026-09-02: 237 KB of JS and 25 KB of
# CSS per cold load. Deliberately no image types -- the uploads are already
# compressed JPEG, so gzipping them costs CPU and saves nothing.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json
           application/xml image/svg+xml;


# HTTP: redirect everything to HTTPS with the canonical hostname
server {
    listen 80;
    server_name 141.5.100.246 c100-246.cloud.gwdg.de;
    access_log /var/log/nginx/access.log proxymain;

    # ACME challenge for certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://c100-246.cloud.gwdg.de$request_uri;
    }
}

# HTTPS: serve the application
server {
    listen 443 ssl;
    # Without this, ALPN negotiated http/1.1 and a browser was limited to 6
    # concurrent connections to this origin. nginx is 1.31 here, so this is the
    # `http2 on;` directive rather than the deprecated `listen ... http2` form.
    http2 on;
    server_name c100-246.cloud.gwdg.de;
    client_max_body_size 10M;
    access_log /var/log/nginx/access.log proxymain;

    ssl_certificate /etc/letsencrypt/live/c100-246.cloud.gwdg.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c100-246.cloud.gwdg.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=30s;

    location / {
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1 {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload filenames are a random UUID (not a content hash, as this
        # comment used to claim), assigned once at upload time and never
        # reused, so a given URL never changes content and can be cached hard.
        # Files uploaded before 2026-09-02 also carry the uploader's original
        # name as a prefix; the handler no longer does that. These are
        # 2-5 MB originals rendered into a 220px box, so a repeat visit
        # re-downloading them was the single biggest transfer on the page.
        # One explicit header rather than `expires` plus add_header, which
        # emits two competing Cache-Control lines.
        add_header Cache-Control "public, max-age=2592000, immutable";

        # The defaults are 8 x 4k, so every photo overflowed into a temp file
        # under /var/cache/nginx/proxy_temp -- an extra disk write and read per
        # image, logged as "an upstream response is buffered to a temporary
        # file". 1 MB of buffers keeps the common case in memory.
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }
}

# The canonical host is the only name on the certificate, so https://<ip> gets a
# name-mismatch warning no matter what -- Let's Encrypt will not issue an IP SAN.
# What this block adds is that after clicking through, the visitor lands on the
# canonical hostname instead of a working-but-wrong-origin copy of the app
# (localStorage, and so every saved session and vote id, is per-origin).
server {
    listen 443 ssl;
    http2 on;
    server_name 141.5.100.246;
    access_log /var/log/nginx/access.log proxymain;

    ssl_certificate /etc/letsencrypt/live/c100-246.cloud.gwdg.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c100-246.cloud.gwdg.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://c100-246.cloud.gwdg.de$request_uri;
}
