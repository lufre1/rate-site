server {
    listen 80;
    server_name _;  # CHANGE TO YOUR DOMAIN (e.g. mensa.example.com)
    client_max_body_size 10M;

    # Use Docker DNS for runtime hostname resolution
    resolver 127.0.0.11 valid=10s;

    # COMPATIBILITY SHIM -- strips one /api prefix before proxying to backend.
    #
    # The app no longer needs this. Until 2026-09-01 the bundle was built with
    # REACT_APP_API_URL=/api and so requested `/api/api/v1/...`; that missed the
    # reverse proxy's `location /api/v1` and landed here, where this block
    # removed the extra prefix. The build now uses an empty base and goes
    # straight to the backend through the proxy.
    #
    # Kept only so browsers holding a bundle cached from before that change keep
    # working. Safe to delete once those have aged out -- delete
    # `test_legacy_doubled_prefix_shim` in
    # backend/tests/test_frontend_api_integration.py at the same time.
    location ~ ^/api/(.*) {
        proxy_pass http://backend:8000/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend static files - prevent caching of index.html
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed build assets (main.6358456b.js) -- the filename changes whenever the
    # content does, so these are safe to cache for a year. They carried only an
    # ETag until 2026-09-02, so every reload spent a revalidation round-trip per
    # asset. Must sit above `location /`, which would otherwise serve them.
    location /static/ {
        root /usr/share/nginx/html;
        # `expires` and not add_header: a location that declares any add_header
        # stops inheriting the server-level ones, which would silently drop
        # X-Frame-Options and friends from every JS and CSS response.
        expires 1y;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
