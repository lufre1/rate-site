<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!-- No maximum-scale: capping zoom at 3x fails WCAG 1.4.4. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Bewerte Gerichte in den Göttinger Mensen." />
    <meta name="theme-color" content="#ea580c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#7c2d12" media="(prefers-color-scheme: dark)" />
    <title>Mensa Rating</title>
    <script>
      // Apply the saved theme before first paint, otherwise a dark-mode user
      // gets a white flash while the React bundle loads. Mirrors applyTheme()
      // in src/shared.js -- keep the 'mensa_theme' key in sync.
      (function () {
        try {
          var t = localStorage.getItem('mensa_theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* private mode: fall back to the OS preference */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
