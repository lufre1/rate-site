# Drop-in for earlyoom.service -- installed to
# /etc/systemd/system/earlyoom.service.d/priority.conf by ops/install-host-monitoring.sh
#
# earlyoom's own -p flag (nice -20, oom_score_adj -100) FAILS on Debian, because
# the shipped unit uses DynamicUser=true and the daemon has already dropped
# privileges by the time it tries:
#     earlyoom[15374]: Could not set priority: Permission denied. Continuing anyway
#     earlyoom[15374]: Could not set oom_score_adj: Permission denied. Continuing anyway
#
# systemd applies both of these from the manager, before the privilege drop, so
# they actually take effect. This matters more than it looks: the failure mode
# earlyoom exists to interrupt is a reclaim livelock in which almost nothing gets
# scheduled, and a daemon at default priority may not run in time to act.
[Service]
Nice=-20
OOMScoreAdjust=-100
