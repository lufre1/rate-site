# Installed to /etc/systemd/journald.conf.d/10-sync.conf
#
# journald's default SyncIntervalSec for persistent storage is FIVE MINUTES, and
# that is the mechanical reason both host lock-ups are unexplained: `journalctl
# -b -1` ends at 2026-09-01 12:05:28 and `-b -2` at 2026-08-31 11:20:43, both
# mid-sentence, with no shutdown target. The proof that this is buffering rather
# than the machine actually stopping there is in the Postgres container's own
# log, which records the database still alive at 12:10:45 -- five minutes past
# journald's last written line.
#
# 10s costs a handful of extra fsyncs per minute on a host whose application
# logs go to Docker's json-file driver, not to the journal.
[Journal]
Storage=persistent
SyncIntervalSec=10s
