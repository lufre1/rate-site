# Dev proxy config. A COPY of nginx-proxy.conf on purpose: both stacks used to
# bind-mount the same file, so editing it to try something in dev changed the
# production proxy's config on its next reload.
# server_name is `_` (catch-all) rather than prod's hardcoded IP.
server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    resolver 127.0.0.11 valid=30s;

    location / {
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1 {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}