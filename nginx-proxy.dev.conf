# Dev proxy config. A COPY of nginx-proxy.conf on purpose: both stacks used to
# bind-mount the same file, so editing it to try something in dev changed the
# production proxy's config on its next reload.
# server_name is `_` (catch-all) rather than prod's hardcoded IP.
# Kept in step with nginx-proxy.conf's format so a log line means the same thing
# in either environment. Dev is HTTP-only, so :80 http is the only combination
# that appears here -- the point is that the field exists at all.
log_format proxymain '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent :$server_port $scheme '
                     'rt=$request_time urt=$upstream_response_time '
                     '"$http_referer" "$http_user_agent"';
# The bundle went out uncompressed until 2026-09-02: 237 KB of JS and 25 KB of
# CSS per cold load. Deliberately no image types -- the uploads are already
# compressed JPEG, so gzipping them costs CPU and saves nothing.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json
           application/xml image/svg+xml;


server {
    listen 80;
    server_name _;
    client_max_body_size 10M;
    access_log /var/log/nginx/access.log proxymain;

    resolver 127.0.0.11 valid=30s;

    location / {
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1 {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Kept in step with prod: upload filenames carry a content hash.
        # One explicit header rather than `expires` plus add_header, which
        # emits two competing Cache-Control lines.
        add_header Cache-Control "public, max-age=2592000, immutable";
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }
}